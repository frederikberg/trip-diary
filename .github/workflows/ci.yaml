name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
  BUN_VERSION: "1.4.4"

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'src/**'
              - 'web/**'
              - 'test/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'config/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'biome.json'
              - '.github/workflows/ci.yaml'
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yaml'

  checks:
    name: Types, lint, tests, build
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx biome ci .
      - run: bun test test/
      - run: bun scripts/build-web.ts

  image:
    name: Image builds
    needs: detect
    if: needs.detect.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          tags: trip-diary:ci

  gate:
    name: Validation
    needs: [detect, checks, image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
