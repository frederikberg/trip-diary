# trip-diary behind Caddy and oauth2-proxy. Copy this folder, copy .env.example to .env, fill it in.
# docs/self-hosting.md explains every line.
services:
  trip-diary:
    image: ghcr.io/frederikberg/trip-diary:latest
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      TRIP_IMMICH_URL: ${IMMICH_URL}
      TRIP_SERVER_PUBLIC_URL: https://${TRIP_HOST}
      TRIP_SERVER_EDIT_URL: https://${TRIP_EDIT_HOST}
      TRIP_AUTH_EDITOR_FROM_HEADER: "true"
      TRIP_AUTH_ALLOWED_EMAILS: ${EDITOR_EMAILS}
    volumes:
      - trip-data:/data
    # The admin API (for the `trip` command) is reachable from this machine only.
    ports:
      - "127.0.0.1:8080:8080"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://${TRIP_EDIT_HOST}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${TRIP_EDIT_HOST}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_COOKIE_SECURE: "true"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      TRIP_HOST: ${TRIP_HOST}
      TRIP_EDIT_HOST: ${TRIP_EDIT_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  trip-data:
  caddy-data:
