<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!--OG-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin">
<meta name="theme-color" content="#fbf8f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title><!--TITLE--></title>
<link rel="icon" href="/assets/map-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/map-icon-180.png">
<!--ASSETS-->
</head>
<body>
<noscript><p style="padding:2em;font:16px system-ui">Diese Karte braucht JavaScript.</p></noscript>
<div id="map" aria-label="Karte"></div>
<div id="search" role="search"></div>
<div id="badge" hidden>Nur ansehen</div>
<div class="fabs" id="fabs"></div>
<section id="sheet" aria-label="Einträge"><p class="empty">Die Karte startet nicht in diesem Browser. Mit einem aktuellen Browser oder einem neueren System geht es.</p></section>
<div id="move-bar" hidden>
  <p>Pin ziehen oder auf die Karte tippen</p>
  <div><button type="button" id="move-cancel">Abbrechen</button><button type="button" id="move-done" class="save">Fertig</button></div>
</div>
<section id="form" aria-label="Eintrag bearbeiten" hidden></section>
<div id="toast" role="status"></div>
<input id="avatar-file" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
<div id="sab-probe"></div>
<script id="data" type="application/json"><!--MAP--></script>
</body>
</html>
